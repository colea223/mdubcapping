<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mid-American Predictions - One High Coverage</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page-wrap">
  <div class="page-header">
    <div class="page-header-text">
      <h1 id="page-title">Model Predictions</h1>
      <p>This week's model spread, total, and win probability for every FBS game, with notes -- plus the Ridge and Dub Beta candidate models' own lines for comparison. Filterable by conference.</p>
    </div>
    <div class="week-badge" id="week-badge" style="display:none;"></div>
  </div>

  <div id="conf-filter-container"></div>
  <div id="predictions-container"></div>

  <div class="footer-note" id="updated"></div>
</div>

<script>window.FIXED_CONFERENCE = "Mid-American";</script>
<script src="assets/site.js"></script>
<script>
document.getElementById("nav").innerHTML = renderNav("predictions.html");

let PREDICTIONS_DATA = null;
let LOGO_MAP = {};

function renderPredictions(selectedConf) {
  const container = document.getElementById("predictions-container");
  if (!PREDICTIONS_DATA || !PREDICTIONS_DATA.predictions || !PREDICTIONS_DATA.predictions.length) {
    container.innerHTML = emptyState("No predictions yet -- the model needs a full pipeline run (and enough graded history) before it can post picks.");
    return;
  }

  const filtered = PREDICTIONS_DATA.predictions.filter(p => matchesConference(selectedConf, p.home_conf, p.away_conf));
  if (!filtered.length) {
    container.innerHTML = emptyState(`No ${selectedConf} predictions found this week.`);
    return;
  }

  function renderCard(p) {
    const spreads = formatSpreadPair(p.model_spread_home);
    const marketSpreads = formatSpreadPair(p.market_spread_home);
    const homeProb = p.home_win_prob !== null && p.home_win_prob !== undefined ? p.home_win_prob : 0.5;
    const homePct = Math.round(homeProb * 100);
    const awayPct = 100 - homePct;
    const favTeam = p.model_spread_home !== null && p.model_spread_home < 0 ? p.home_team : p.away_team;

    // lean_side/is_real_edge come straight from backtest.grade_spread_pick()
    // (see export_site_data.py's build_matchups_and_predictions() and its
    // _grade_model_line() helper) -- the SAME function that decides the
    // season record on the Tracking page, so this tag always matches what
    // eventually gets graded there. A real edge (is_real_edge true) shows
    // the model's own value pick same as always; anything smaller now
    // defaults to the market's actual favorite instead of a bare "no
    // significant edge" label -- see backtest.py's own docstring for why
    // (a tiny edge can point the wrong direction relative to who's really
    // favored). lean_side is only ever null for a true pick'em (market
    // spread of exactly 0), which has no favorite to default to.
    let edgeClass = "none", edgeLabel = "No pick";
    if (p.lean_side && p.lean_side !== "Pick'em") {
      const leanTeam = p.lean_side === "Home" ? p.home_team : p.away_team;
      if (p.is_real_edge) {
        edgeClass = p.lean_side === "Home" ? "lean-home" : "lean-away";
        edgeLabel = `Lean ${leanTeam} (${Math.abs(p.edge).toFixed(1)} pt edge)`;
      } else if (p.edge !== null && p.edge !== undefined && Math.abs(p.edge) >= 1) {
        edgeLabel = `Slight lean ${leanTeam} (${Math.abs(p.edge).toFixed(1)} pt edge)`;
      } else {
        edgeLabel = `No real edge – favorite: ${leanTeam}`;
      }
    } else {
      edgeLabel = "Dead-even pick'em – no favorite";
    }

    const notesHtml = p.notes
      ? `<div class="notes-box">${p.notes}</div>`
      : "";

    const gradeTag = (label, ok) => {
      if (ok === null || ok === undefined) return `<span class="grade-tag push">${label}: n/a</span>`;
      return `<span class="grade-tag ${ok ? "correct" : "incorrect"}">${label}: ${ok ? "Correct" : "Incorrect"}</span>`;
    };

    // Dub Beta Model (XGBoost) -- a candidate architecture shown alongside
    // the live model's own pick above, never with equal weight: it's never
    // part of edge/lean/bet-suggestion logic anywhere on the site, purely a
    // second opinion. null (no beta_model_spread_home) means predict_week.py
    // hasn't been run for this week yet -- see export_site_data.py's
    // build_matchups_and_predictions() docstring comment.
    let betaHtml = "";
    if (p.beta_model_spread_home !== null && p.beta_model_spread_home !== undefined) {
      const betaSpreads = formatSpreadPair(p.beta_model_spread_home);
      const agreeTag = p.beta_agrees === null || p.beta_agrees === undefined
        ? ""
        : (p.beta_agrees
            ? `<span class="grade-tag push">Agrees with live model</span>`
            : `<span class="grade-tag incorrect">Disagrees with live model</span>`);
      const betaNoRealEdgeNote = (p.beta_is_real_edge === false && p.beta_lean_side && p.beta_lean_side !== "Pick'em")
        ? `<span class="odds-label" style="margin-left:6px;">(small edge)</span>`
        : "";
      const betaGradeHtml = (p.completed && p.home_points !== null && p.away_points !== null)
        ? `<div class="beta-line">${gradeTag("Straight up", p.beta_straight_up_correct)}${gradeTag("Vs. market line", p.beta_covered_market_line)}${betaNoRealEdgeNote}</div>`
        : "";
      betaHtml = `
        <div class="beta-block">
          <span class="beta-tag">Dub Beta Model</span>
          <div class="beta-line">
            <span class="odds-value">${formatSpreadLabeled(p.beta_model_spread_home, p.home_team, p.away_team)}</span>
            ${agreeTag}
          </div>
          ${betaGradeHtml}
        </div>`;
    }

    // Ridge -- same "second opinion, never in the live edge/lean logic"
    // treatment as the Dub Beta block just above, mirroring it field for
    // field (ridge_model_spread_home/ridge_agrees/ridge_straight_up_correct/
    // ridge_covered_market_line instead of beta_model_spread_home/
    // beta_agrees/beta_straight_up_correct/beta_covered_market_line). Ridge
    // is a candidate now -- the live model (whose pick is shown above as
    // "Model Spread") is Dub Gamma. See export_site_data.py's
    // build_matchups_and_predictions() for exactly how these are computed.
    let ridgeHtml = "";
    if (p.ridge_model_spread_home !== null && p.ridge_model_spread_home !== undefined) {
      const ridgeSpreads = formatSpreadPair(p.ridge_model_spread_home);
      const ridgeAgreeTag = p.ridge_agrees === null || p.ridge_agrees === undefined
        ? ""
        : (p.ridge_agrees
            ? `<span class="grade-tag push">Agrees with live model</span>`
            : `<span class="grade-tag incorrect">Disagrees with live model</span>`);
      const ridgeNoRealEdgeNote = (p.ridge_is_real_edge === false && p.ridge_lean_side && p.ridge_lean_side !== "Pick'em")
        ? `<span class="odds-label" style="margin-left:6px;">(small edge)</span>`
        : "";
      const ridgeGradeHtml = (p.completed && p.home_points !== null && p.away_points !== null)
        ? `<div class="beta-line">${gradeTag("Straight up", p.ridge_straight_up_correct)}${gradeTag("Vs. market line", p.ridge_covered_market_line)}${ridgeNoRealEdgeNote}</div>`
        : "";
      ridgeHtml = `
        <div class="beta-block">
          <span class="beta-tag">Ridge Model</span>
          <div class="beta-line">
            <span class="odds-value">${formatSpreadLabeled(p.ridge_model_spread_home, p.home_team, p.away_team)}</span>
            ${ridgeAgreeTag}
          </div>
          ${ridgeGradeHtml}
        </div>`;
    }

    // Once the game's final, swap the still-live win-prob bar for the
    // actual result plus how the model's own pick graded -- straight up
    // (did the favored team just win) and against the real market spread
    // (did the SIDE the model leaned -- same lean backtest.py grades a real
    // bet on -- actually cover the market line, i.e. would betting that
    // side have won). This is graded against the market, not the model's
    // own predicted margin -- a model that leans the right side still
    // grades as a win even if the final margin lands short of (or past)
    // the model's own number, as long as that side covered the real line.
    // See export_site_data.py's build_matchups_and_predictions() for
    // exactly how these are computed.
    let resultHtml;
    if (p.completed && p.home_points !== null && p.away_points !== null) {
      const homeWon = p.home_points > p.away_points;
      const awaySpan = homeWon ? `${p.away_team} ${p.away_points}` : `<span class="winner">${p.away_team} ${p.away_points}</span>`;
      const homeSpan = homeWon ? `<span class="winner">${p.home_team} ${p.home_points}</span>` : `${p.home_team} ${p.home_points}`;

      // "Vs. market line" is graded on whatever the tracked pick actually
      // was -- a real edge, or (below threshold) the auto-defaulted
      // favorite. This note flags the latter case so a win/loss here isn't
      // mistaken for a genuine value call.
      const noRealEdgeNote = (p.is_real_edge === false && p.lean_side && p.lean_side !== "Pick'em")
        ? `<span class="odds-label" style="margin-left:6px;">(small edge)</span>`
        : "";
      resultHtml = `
        <div class="final-score">
          <span class="at">@</span>${awaySpan} &ndash; ${homeSpan}
          <span class="final-badge">Final</span>
        </div>
        <div style="margin-top:8px;">
          ${gradeTag("Straight up", p.straight_up_correct)}
          ${gradeTag("Vs. market line", p.covered_market_line)}${noRealEdgeNote}
        </div>`;
    } else {
      resultHtml = `
        <div style="margin-top:12px;">
          <span class="edge-tag ${edgeClass}">${edgeLabel}</span>
          <div class="win-prob-labels">
            <span>${p.away_team} ${awayPct}%</span>
            <span>${p.home_team} ${homePct}%</span>
          </div>
          <div class="win-prob-bar-split">
            <div class="away-fill" style="width:${awayPct}%"></div>
            <div class="home-fill" style="width:${homePct}%"></div>
          </div>
        </div>`;
    }

    const recordTag = (r) => (r && (r[0] || r[1])) ? `<span class="team-record">${r[0]}-${r[1]}</span>` : "";
    const favSpread = favTeam === p.home_team ? spreads.home : spreads.away;
    const marketSummary = (p.market_spread_home !== null && p.market_spread_home !== undefined)
      ? `${favTeam} ${favSpread} | O/U ${p.market_total !== null && p.market_total !== undefined ? p.market_total : "TBD"}`
      : `O/U ${p.market_total !== null && p.market_total !== undefined ? p.market_total : "TBD"}`;

    return `
      <div class="matchup-card">
        <div class="card-meta-row">
          <span class="kickoff-time">${formatKickoffTime(p.start_time)}</span>
          <span class="market-summary">${marketSummary}</span>
        </div>
        <div class="matchup-teams">
          <div class="team-row">
            <span class="name"><span class="at">@</span>${teamLogoImg(p.away_team, LOGO_MAP)}${p.away_team}${recordTag(p.away_record)}</span>
          </div>
          <div class="team-row">
            <span class="name">${teamLogoImg(p.home_team, LOGO_MAP)}${p.home_team}${recordTag(p.home_record)}</span>
          </div>
        </div>
        ${selectedConf === ALL_CONFERENCES ? `<div class="conf-tag">${p.away_conf || ""} @ ${p.home_conf || ""}</div>` : ""}
        <div class="odds-row">
          <div class="odds-item">
            <span class="odds-label">Vegas Spread</span>
            <span class="odds-value">${formatSpreadLabeled(p.market_spread_home, p.home_team, p.away_team)}</span>
          </div>
          <div class="odds-item">
            <span class="odds-label">Vegas Total</span>
            <span class="odds-value">${p.market_total !== null && p.market_total !== undefined ? p.market_total : "TBD"}</span>
          </div>
          <div class="odds-item">
            <span class="odds-label">Model Spread</span>
            <span class="odds-value">${formatSpreadLabeled(p.model_spread_home, p.home_team, p.away_team)}</span>
          </div>
          <div class="odds-item">
            <span class="odds-label">Model Total</span>
            <span class="odds-value">${p.model_total !== null && p.model_total !== undefined ? p.model_total : "TBD"}</span>
          </div>
          <div class="odds-item">
            <span class="odds-label">Favorite</span>
            <span class="odds-value">${favTeam}</span>
          </div>
        </div>
        ${resultHtml}
        ${betaHtml}
        ${ridgeHtml}
        ${notesHtml}
      </div>`;
  }

  const groups = groupByDay(filtered, "start_time");
  container.innerHTML = groups.map(g => `
    <div class="day-group">
      <div class="day-group-header">
        <h2>${g.label}</h2>
        <span class="day-group-count">${g.items.length} game${g.items.length === 1 ? "" : "s"}</span>
      </div>
      <div class="matchup-grid">${g.items.map(renderCard).join("")}</div>
    </div>`).join("");
}

(async function () {
  const [predictionsData, rankingsData] = await Promise.all([
    fetchJSON("data/predictions.json"),
    fetchJSON("data/rankings.json"),
  ]);
  PREDICTIONS_DATA = predictionsData;
  LOGO_MAP = teamLogoMap(rankingsData);
  const selected = getPageConference();

  document.getElementById("conf-filter-container").innerHTML = renderConferenceLinkStrip("predictions", selected);
  renderPredictions(selected);

  if (PREDICTIONS_DATA && PREDICTIONS_DATA.meta && PREDICTIONS_DATA.meta.current_week) {
    const badge = document.getElementById("week-badge");
    badge.textContent = `Week ${PREDICTIONS_DATA.meta.current_week.week}`;
    badge.style.display = "";
    document.getElementById("page-title").textContent =
      `Week ${PREDICTIONS_DATA.meta.current_week.week} Predictions`;
  }
  if (PREDICTIONS_DATA) {
    document.getElementById("updated").textContent = lastUpdatedLabel(PREDICTIONS_DATA.meta && PREDICTIONS_DATA.meta.generated_at);
  }
})();
</script>
</body>
</html>
