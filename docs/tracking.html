<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracking - Mountain Dub Handicapping</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page-wrap">
  <div class="page-header">
    <h1>Season Tracking</h1>
    <p>Two separate records, never blended: what you've actually bet, and how the model's own picks have graded out.</p>
  </div>

  <div class="card" style="margin-bottom:20px;" id="pending-card">
    <div class="section-title">Pending Bets</div>
    <div id="pending-container"></div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="section-title">Your Bets</div>
    <div id="yours-container"></div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="section-title">Model's Picks (Hypothetical)</div>
    <div id="model-container"></div>
  </div>

  <div class="card">
    <div class="section-title">Dub Beta Model <span class="beta-tag">Candidate, Spread Only</span></div>
    <div id="beta-container"></div>
  </div>

  <div class="footer-note" id="updated"></div>
</div>

<script src="assets/site.js"></script>
<script>
document.getElementById("nav").innerHTML = renderNav("tracking.html");

function unitsLabel(units) {
  if (units === null || units === undefined) return "&ndash;";
  return units > 0 ? `+${units.toFixed(2)}u` : `${units.toFixed(2)}u`;
}
function unitsClass(units) {
  if (units === null || units === undefined) return "";
  return units > 0 ? "good" : (units < 0 ? "critical" : "");
}
function pct(rate) {
  return (rate === null || rate === undefined) ? "&ndash;" : (rate * 100).toFixed(1) + "%";
}
function record(b) {
  return `${b.wins}-${b.losses}${b.pushes ? `-${b.pushes}` : ""}`;
}

function renderYours(yours) {
  const container = document.getElementById("yours-container");
  if (!yours || !yours.n_bets) {
    container.innerHTML = emptyState(
      (yours && yours.note) || "No graded bets in your Bet Log yet -- add a Result (W/L/P) to a row and rerun the pipeline."
    );
    return;
  }

  let byTypeRows = "";
  if (yours.by_type) {
    const rows = Object.entries(yours.by_type).map(([type, b]) => `
      <tr>
        <td class="team-name">${type}</td>
        <td class="num">${record(b)}</td>
        <td class="num">${pct(b.win_rate)}</td>
        <td class="num ${unitsClass(b.units)}">${unitsLabel(b.units)}</td>
      </tr>`).join("");
    byTypeRows = `
      <table class="rankings" style="margin-top:16px;">
        <thead><tr><th>Bet Type</th><th class="num">Record</th><th class="num">Win Rate</th><th class="num">Units</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  container.innerHTML = `
    <div class="stat-grid">
      <div class="stat-tile">
        <div class="label">Overall Record</div>
        <div class="value">${record(yours)}</div>
        <div class="sub">${yours.n_bets} graded bets</div>
      </div>
      <div class="stat-tile">
        <div class="label">Win Rate</div>
        <div class="value">${pct(yours.win_rate)}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Units</div>
        <div class="value ${unitsClass(yours.units)}">${unitsLabel(yours.units)}</div>
        <div class="sub">at the real odds you entered</div>
      </div>
    </div>
    ${byTypeRows}`;
}

function renderModel(model) {
  const container = document.getElementById("model-container");
  if (!model || !model.n_games || (!model.spread && !model.total && !model.moneyline)) {
    container.innerHTML = emptyState(
      (model && model.note) || "Not enough graded history yet -- check back once more games are played and graded."
    );
    return;
  }

  const types = [
    ["Spread", model.spread],
    ["Total", model.total],
    ["Moneyline", model.moneyline],
  ].filter(([, b]) => b && b.n_bets !== undefined);

  const rows = types.map(([label, b]) => `
    <tr>
      <td class="team-name">${label}</td>
      <td class="num">${record(b)}</td>
      <td class="num">${pct(b.win_rate)}</td>
      <td class="num ${unitsClass(b.units)}">${unitsLabel(b.units)}</td>
    </tr>`).join("");

  const upsetPct = model.upset_calls ? Math.round((model.upset_wins / model.upset_calls) * 100) : null;

  container.innerHTML = `
    <table class="rankings">
      <thead><tr><th>Bet Type</th><th class="num">Record</th><th class="num">Win Rate</th><th class="num">Units (flat 1u)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="stat-grid" style="margin-top:16px;">
      <div class="stat-tile">
        <div class="label">Upset Calls (Spread)</div>
        <div class="value">${model.upset_wins}-${model.upset_calls - model.upset_wins}</div>
        <div class="sub">${upsetPct !== null ? upsetPct + "% hit rate" : "No upset leans yet"} on ${model.upset_calls} calls</div>
      </div>
      <div class="stat-tile">
        <div class="label">Games Graded</div>
        <div class="value">${model.n_games}</div>
        <div class="sub">Mountain West games, ${model.season} season</div>
      </div>
    </div>
    <div class="notes-box">${model.note}</div>`;
}

// Dub Beta Model (XGBoost) -- spread only (model_comparison.py, its data
// source, only ever compares margin models -- see export_site_data.py's
// build_beta_tracking() docstring). A snapshot from the last manual run of
// src/model_comparison.py, so it can lag behind Model's Picks above, which
// is why it gets its own note rather than sharing renderModel()'s.
function renderBeta(beta) {
  const container = document.getElementById("beta-container");
  if (!beta || !beta.n_games || !beta.spread || beta.spread.n_bets === undefined) {
    container.innerHTML = emptyState(
      (beta && beta.note) || "No Dub Beta Model data yet -- run src/model_comparison.py, then src/export_site_data.py."
    );
    return;
  }

  const b = beta.spread;
  container.innerHTML = `
    <div class="stat-grid">
      <div class="stat-tile">
        <div class="label">Record (ATS)</div>
        <div class="value">${record(b)}</div>
        <div class="sub">${b.n_bets} graded bets</div>
      </div>
      <div class="stat-tile">
        <div class="label">Win Rate</div>
        <div class="value">${pct(b.win_rate)}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Units (flat 1u)</div>
        <div class="value ${unitsClass(b.units)}">${unitsLabel(b.units)}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Agrees w/ Live Model</div>
        <div class="value">${beta.agree_rate !== null && beta.agree_rate !== undefined ? pct(beta.agree_rate) : "&ndash;"}</div>
        <div class="sub">${beta.n_games} MW games compared, ${beta.season} season</div>
      </div>
    </div>
    ${beta.note ? `<div class="notes-box">${beta.note}</div>` : ""}`;
}

function renderPending(pending) {
  const container = document.getElementById("pending-container");
  if (!pending || !pending.length) {
    container.innerHTML = emptyState("Nothing pending -- every bet in your Bet Log has a Result, or you haven't logged one yet.");
    return;
  }

  const rows = pending.map(b => {
    const oddsLabel = b.odds > 0 ? `+${b.odds}` : `${b.odds}`;
    return `
      <tr>
        <td>${formatDate(b.date) || b.date || ""}</td>
        <td class="team-name">${b.matchup || ""}</td>
        <td>${b.bet_type}</td>
        <td>${b.side || ""}</td>
        <td class="num">${oddsLabel}</td>
        <td class="num">${b.stake}u</td>
      </tr>`;
  }).join("");

  container.innerHTML = `
    <table class="rankings">
      <thead><tr><th>Date</th><th>Matchup</th><th>Type</th><th>Side</th><th class="num">Odds</th><th class="num">Stake</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

(async function () {
  const data = await fetchJSON("data/tracking.json");
  if (!data || !data.tracking) {
    document.getElementById("pending-container").innerHTML = emptyState("No tracking data yet -- run the pipeline to generate this.");
    document.getElementById("yours-container").innerHTML = emptyState("No tracking data yet -- run the pipeline to generate this.");
    document.getElementById("model-container").innerHTML = "";
    document.getElementById("beta-container").innerHTML = "";
    return;
  }
  renderPending(data.tracking.yours && data.tracking.yours.pending);
  renderYours(data.tracking.yours);
  renderModel(data.tracking.model);
  renderBeta(data.tracking.beta_model);
  document.getElementById("updated").textContent = lastUpdatedLabel(data.meta && data.meta.generated_at);
})();
</script>
</body>
</html>
