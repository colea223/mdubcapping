<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mountain West Matchups - One High Coverage</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page-wrap">
  <div class="page-header">
    <div class="page-header-text">
      <h1 id="page-title">This Week's Matchups</h1>
      <p>Market lines for every FBS game on the slate, filterable by conference.</p>
    </div>
    <div class="week-badge" id="week-badge" style="display:none;"></div>
  </div>

  <div id="conf-filter-container"></div>
  <div id="matchups-container"></div>

  <div class="footer-note" id="updated"></div>
</div>

<script>window.FIXED_CONFERENCE = "Mountain West";</script>
<script src="assets/site.js"></script>
<script>
document.getElementById("nav").innerHTML = renderNav("matchups.html");

let MATCHUPS_DATA = null;
let LOGO_MAP = {};

function renderMatchups(selectedConf) {
  const container = document.getElementById("matchups-container");
  if (!MATCHUPS_DATA || !MATCHUPS_DATA.matchups || !MATCHUPS_DATA.matchups.length) {
    container.innerHTML = emptyState("No matchups posted yet -- check back once this week's slate and lines are pulled.");
    return;
  }

  const filtered = MATCHUPS_DATA.matchups.filter(m => matchesConference(selectedConf, m.home_conf, m.away_conf));
  if (!filtered.length) {
    container.innerHTML = emptyState(`No ${selectedConf} games found this week.`);
    return;
  }

  function renderCard(m) {
    const spreads = formatSpreadPair(m.market_spread_home);
    const total = (m.market_total !== null && m.market_total !== undefined) ? m.market_total : "TBD";
    const homeMl = formatMoneyline(m.home_moneyline);
    const awayMl = formatMoneyline(m.away_moneyline);

    const finalHtml = (m.completed && m.home_points !== null && m.away_points !== null) ? (() => {
      const homeWon = m.home_points > m.away_points;
      const awaySpan = homeWon ? `${m.away_team} ${m.away_points}` : `<span class="winner">${m.away_team} ${m.away_points}</span>`;
      const homeSpan = homeWon ? `<span class="winner">${m.home_team} ${m.home_points}</span>` : `${m.home_team} ${m.home_points}`;
      return `
        <div class="final-score">
          <span class="at">@</span>${awaySpan} &ndash; ${homeSpan}
          <span class="final-badge">Final</span>
        </div>`;
    })() : "";

    const confTag = selectedConf === ALL_CONFERENCES
      ? `<div class="conf-tag">${m.away_conf || ""} @ ${m.home_conf || ""}</div>` : "";

    // Favorite's own spread + the total, one line -- e.g. "New Mexico -2.5 | O/U 57".
    const favTeam = m.market_spread_home !== null && m.market_spread_home < 0 ? m.home_team
      : m.market_spread_home !== null ? m.away_team : null;
    const favSpread = favTeam === m.home_team ? spreads.home : spreads.away;
    const marketSummary = favTeam
      ? `${favTeam} ${favSpread} | O/U ${total}`
      : `O/U ${total}`;

    const recordTag = (r) => (r && (r[0] || r[1])) ? `<span class="team-record">${r[0]}-${r[1]}</span>` : "";

    return `
      <div class="matchup-card">
        <div class="card-meta-row">
          <span class="kickoff-time">${formatKickoffTime(m.start_time)}</span>
          <span class="market-summary">${marketSummary}</span>
        </div>
        <div class="matchup-teams">
          <div class="team-row">
            <span class="name"><span class="at">@</span>${teamLogoImg(m.away_team, LOGO_MAP)}${m.away_team}${recordTag(m.away_record)}</span>
            <span class="odds-value">${spreads.away}</span>
          </div>
          <div class="team-row">
            <span class="name">${teamLogoImg(m.home_team, LOGO_MAP)}${m.home_team}${recordTag(m.home_record)}</span>
            <span class="odds-value">${spreads.home}</span>
          </div>
        </div>
        ${confTag}
        <div class="odds-row">
          <div class="odds-item">
            <span class="odds-label">Spread</span>
            <span class="odds-value">${spreads.home} / ${spreads.away}</span>
          </div>
          <div class="odds-item">
            <span class="odds-label">Total</span>
            <span class="odds-value">${total}</span>
          </div>
          <div class="odds-item">
            <span class="odds-label">Moneyline (away/home)</span>
            <span class="odds-value">${awayMl} / ${homeMl}</span>
          </div>
        </div>
        ${finalHtml}
      </div>`;
  }

  const groups = groupByDay(filtered, "start_time");
  container.innerHTML = groups.map(g => `
    <div class="day-group">
      <div class="day-group-header">
        <h2>${g.label}</h2>
        <span class="day-group-count">${g.items.length} game${g.items.length === 1 ? "" : "s"}</span>
      </div>
      <div class="matchup-grid">${g.items.map(renderCard).join("")}</div>
    </div>`).join("");
}

(async function () {
  const [matchupsData, rankingsData] = await Promise.all([
    fetchJSON("data/matchups.json"),
    fetchJSON("data/rankings.json"),
  ]);
  MATCHUPS_DATA = matchupsData;
  LOGO_MAP = teamLogoMap(rankingsData);
  const selected = getPageConference();

  document.getElementById("conf-filter-container").innerHTML = renderConferenceLinkStrip("matchups", selected);
  renderMatchups(selected);

  if (MATCHUPS_DATA && MATCHUPS_DATA.meta && MATCHUPS_DATA.meta.current_week) {
    const badge = document.getElementById("week-badge");
    badge.textContent = `Week ${MATCHUPS_DATA.meta.current_week.week}`;
    badge.style.display = "";
    document.getElementById("page-title").textContent =
      `Week ${MATCHUPS_DATA.meta.current_week.week} Matchups`;
  }
  if (MATCHUPS_DATA) {
    document.getElementById("updated").textContent = lastUpdatedLabel(MATCHUPS_DATA.meta && MATCHUPS_DATA.meta.generated_at);
  }
})();
</script>
</body>
</html>
