<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchup Creator - Mountain Dub Handicapping</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page-wrap">
  <div class="page-header">
    <h1>Matchup Creator</h1>
    <p>Pick any two FBS teams and see the live model's predicted spread and win probability for that matchup -- even one that isn't on this season's schedule.</p>
  </div>

  <div class="card" id="picker-card">
    <div class="section-title">Choose A Matchup</div>
    <div class="matchup-picker">
      <div class="picker-field">
        <label for="away-input">Away</label>
        <input id="away-input" type="text" list="team-options" autocomplete="off" placeholder="Type a team...">
      </div>
      <button id="swap-btn" class="swap-btn" type="button" title="Swap home/away">&#8646;</button>
      <div class="picker-field">
        <label for="home-input">Home</label>
        <input id="home-input" type="text" list="team-options" autocomplete="off" placeholder="Type a team...">
      </div>
    </div>
    <datalist id="team-options"></datalist>
    <div class="model-toggle" id="model-toggle">
      <label>
        <input type="radio" name="model-choice" value="ridge" checked>
        Ridge <span class="model-toggle-sub">(Live Model)</span>
      </label>
      <label>
        <input type="radio" name="model-choice" value="xgboost">
        Dub Beta <span class="model-toggle-sub">(XGBoost, candidate)</span>
      </label>
      <label>
        <input type="radio" name="model-choice" value="gamma">
        Dub Gamma <span class="model-toggle-sub">(Moore-seeded, candidate)</span>
      </label>
    </div>
  </div>

  <div id="matchup-result" style="margin-top:16px;"></div>

  <div class="footer-note" id="updated"></div>
</div>

<script src="assets/site.js"></script>
<script>
document.getElementById("nav").innerHTML = renderNav("matchup.html");

// Every prediction here comes precomputed from docs/data/matchup_grid.json
// (see export_site_data.py's build_matchup_grid()) -- the site is fully
// static, so there's no server to fit either model against an arbitrary
// pair on the fly. build_matchup_grid() fits BOTH the live Ridge margin
// model AND the Dub Beta (XGBoost) candidate on the same training data,
// PLUS runs the Dub Gamma Model's rating-diff formula (no fit -- see that
// function's own docstring), so this page -- unlike every other page,
// where Dub Beta/Gamma are only ever a secondary annotation next to
// Ridge's own pick -- lets the viewer toggle which one they're looking at.
// Whichever is selected, it's run against a hypothetical, not-necessarily-
// scheduled matchup, covering every FBS team that played a game this
// season (Gamma additionally needs a Moore seed rating for the team --
// see gamma_model.py/moore_seed_2026.py; a team with none falls back to
// gamma_model.DEFAULT_SEED_RATING, same as everywhere else Gamma runs).
// Two assumptions make the hypothetical possible: both teams are assumed
// equally rested, and the game is assumed played at the "Home" team's own
// usual venue (so "Away" travels/adjusts for elevation exactly like a real
// true road game). Everything else -- whether it's a real conference game,
// whether either team is a current Mountain West team, travel distance,
// elevation change, power ratings, and prior-season strength metrics --
// is the real value for that specific pair, not a blanket guess.
const MODEL_LABELS = { ridge: "Ridge", xgboost: "Dub Beta (XGBoost)", gamma: "Dub Gamma" };
const MODEL_BADGE_TAGS = { xgboost: "Dub Beta Model", gamma: "Dub Gamma Model" };

function renderResult(home, away, modelCell, residualStd, modelChoice) {
  const container = document.getElementById("matchup-result");
  if (!home || !away) {
    container.innerHTML = emptyState("Pick two teams from the list to see a predicted matchup.");
    return;
  }
  if (home === away) {
    container.innerHTML = emptyState("Pick two different teams to see a predicted matchup.");
    return;
  }
  if (!modelCell) {
    container.innerHTML = emptyState("No prediction available for this matchup yet -- rerun the pipeline to regenerate the matchup grid.");
    return;
  }

  const spreadHome = modelCell.spread_home;
  const spreadAway = -spreadHome;
  const fmt = (v) => (v > 0 ? `+${v}` : `${v}`);
  // Favorite's OWN spread number, not the raw home-referenced predicted
  // margin -- this project's spread convention (site.js's formatSpreadPair,
  // the Predicted Spread pair right above) is negative = favored. Reusing
  // spreadHome/spreadAway here (rather than re-deriving from
  // modelCell.predicted_margin with a manually-added "+") keeps the favorite
  // always shown as "-X.X", matching standard sportsbook notation and never
  // contradicting the Predicted Spread line two rows up.
  const favTeam = spreadHome < 0 ? home : (spreadAway < 0 ? away : null);
  const favSpread = spreadHome < 0 ? spreadHome : (spreadAway < 0 ? spreadAway : null);
  // Gamma has no win-probability concept at all (it's a rating-diff formula,
  // not a fitted model with a residual to convert into odds -- see this
  // function's own top comment and build_matchup_grid()'s docstring), so
  // home_win_prob is simply absent from its grid cell -- guard the whole
  // win-prob bar on that instead of assuming every model has one.
  const homeProb = modelCell.home_win_prob;
  const hasWinProb = homeProb !== null && homeProb !== undefined;
  const homePct = hasWinProb ? Math.round(homeProb * 100) : null;
  const awayPct = hasWinProb ? 100 - homePct : null;
  const winProbHtml = hasWinProb ? `
      <div style="margin-top:12px;">
        <div class="win-prob-bar"><div class="win-prob-fill" style="width:${homePct}%"></div></div>
        <div class="odds-label" style="margin-top:4px;">
          ${home} ${homePct}% &ndash; ${away} ${awayPct}%
        </div>
      </div>` : "";
  // Same dashed-purple "candidate, not the live model" badge Predictions/
  // Results/Tracking already use for Dub Beta/Gamma -- shown here too so
  // picking either candidate never reads as if it carries equal weight to
  // Ridge.
  const badgeTag = MODEL_BADGE_TAGS[modelChoice];
  const badgeHtml = badgeTag ? `<div style="margin-bottom:10px;"><span class="beta-tag">${badgeTag}</span></div>` : "";
  const modelLabel = MODEL_LABELS[modelChoice];
  // Gamma's notes drop the "typical model error" sentence entirely (no
  // residualStd exists for it to report -- see above) rather than printing
  // a blank/undefined number.
  const errorSentence = (residualStd !== null && residualStd !== undefined)
    ? ` Typical model error on a real game this season has been about &plusmn;${residualStd} points.`
    : "";

  container.innerHTML = `
    <div class="matchup-card">
      ${badgeHtml}
      <div class="matchup-teams">
        <div class="team-row">
          <span class="name"><span class="at">@</span>${away}</span>
        </div>
        <div class="team-row">
          <span class="name">${home}</span>
        </div>
      </div>
      <div class="odds-row">
        <div class="odds-item">
          <span class="odds-label">Predicted Spread</span>
          <span class="odds-value">${fmt(spreadHome)} / ${fmt(spreadAway)}</span>
        </div>
        <div class="odds-item">
          <span class="odds-label">Favorite</span>
          <span class="odds-value">${favTeam ? `${favTeam} ${fmt(favSpread)}` : "Pick 'em"}</span>
        </div>
      </div>
      ${winProbHtml}
      <div class="notes-box">
        A hypothetical ${modelLabel} model estimate, not a market line --
        assumes equal rest for both teams and the game played at ${home}'s usual home venue. ${away}'s
        travel distance and elevation change are the real numbers for that trip.${errorSentence}
      </div>
    </div>`;
}

(async function () {
  const data = await fetchJSON("data/matchup_grid.json");
  const pickerCard = document.getElementById("picker-card");
  const result = document.getElementById("matchup-result");

  if (!data || !data.teams || !data.teams.length || !data.grid) {
    pickerCard.style.display = "none";
    result.innerHTML = emptyState("No matchup creator data yet -- run the pipeline to generate this.");
    return;
  }

  const teams = data.teams;
  const teamSet = new Set(teams);
  const homeInput = document.getElementById("home-input");
  const awayInput = document.getElementById("away-input");
  document.getElementById("team-options").innerHTML =
    teams.map(t => `<option value="${t}">`).join("");
  homeInput.value = teams[0] || "";
  awayInput.value = teams.length > 1 ? teams[1] : (teams[0] || "");

  // A plain text input + <datalist> instead of a <select> -- with every FBS
  // team in the list (100+), a native dropdown is a long scroll to find one
  // team; this lets you type to filter and still only accepts an exact,
  // valid team name (see refresh()'s home/away null-out below) so a
  // half-typed name can't silently look up the wrong matchup.
  function refresh() {
    const home = teamSet.has(homeInput.value) ? homeInput.value : null;
    const away = teamSet.has(awayInput.value) ? awayInput.value : null;
    const pair = (home && away && data.grid[home]) ? data.grid[home][away] : undefined;
    const modelChoice = document.querySelector('input[name="model-choice"]:checked').value;
    const modelCell = pair ? pair[modelChoice] : undefined;
    // Gamma has no residual_std anywhere in matchup_grid.json (see
    // build_matchup_grid()'s docstring) -- undefined here correctly tells
    // renderResult() to drop the "typical model error" sentence rather than
    // printing "undefined points".
    const residualStd = modelChoice === "xgboost" ? data.xgboost_residual_std
      : modelChoice === "ridge" ? data.ridge_residual_std
      : undefined;
    renderResult(home, away, modelCell, residualStd, modelChoice);
  }

  homeInput.addEventListener("input", refresh);
  awayInput.addEventListener("input", refresh);
  document.getElementById("swap-btn").addEventListener("click", () => {
    const h = homeInput.value, a = awayInput.value;
    homeInput.value = a;
    awayInput.value = h;
    refresh();
  });
  document.querySelectorAll('input[name="model-choice"]').forEach((r) => {
    r.addEventListener("change", refresh);
  });

  refresh();
  document.getElementById("updated").textContent = lastUpdatedLabel(data.meta && data.meta.generated_at);
})();
</script>
</body>
</html>
