name: Update live odds (The Odds API)

# Refreshes the Line History chart's data Monday-Friday from The Odds API --
# a feed completely separate from the CFBD-based weekly_pipeline.yml, on its
# own quota, so it doesn't compete with your CFBD monthly call limit. Costs
# ~3 credits per run (see src/pull_odds_api.py) -- 5x/week is ~65
# credits/month against the free tier's 500, comfortable headroom.
#
# Schedule below runs Mon-Fri mornings UTC, deliberately set an hour AFTER
# weekly_pipeline.yml's 14:00 UTC Sun/Wed run (not 14:00 itself) on the one
# day they overlap (Wednesday) -- both workflows touch overlapping files
# (db/, docs/data/lines.json, docs/data/line_history.json), so firing at the
# exact same time means whichever finishes first wins the git push and the
# other's push gets rejected (a clean failure, nothing corrupts, but a wasted
# run every time). weekly_pipeline.yml times out at 30 minutes, so the 1-hour
# gap here is a comfortable buffer even on a slow run. Sunday is no longer in
# this schedule at all, so there's nothing to stagger against
# weekly_pipeline.yml's Sunday run either. You can always trigger an extra
# run by hand from the Actions tab (the workflow_dispatch trigger adds a "Run
# workflow" button). Cron times are UTC; adjust if you want a different local
# time -- just keep Wednesday at least ~30-60 min clear of
# weekly_pipeline.yml's 14:00 UTC slot.

on:
  schedule:
    - cron: "0 15 * * 1-5"  # Monday-Friday, 15:00 UTC (1hr clear of weekly_pipeline.yml's Wed 14:00 UTC run)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-odds-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run odds update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/run_odds_update.py

      - name: Commit updated data back to the repo
        run: |
          git config user.name "mw-handicapping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/ data/raw/odds_api_*.json docs/data/lines.json docs/data/line_history.json
          if git diff --cached --quiet; then
            echo "Nothing changed -- skipping commit."
          else
            git commit -m "Live odds refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi